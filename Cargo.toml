[workspace]
resolver = "2"
members = ["app", "controllers", "models"]

[workspace.dependencies.rocket_security]
version = "0.1.0"
git = "https://github.com/j03-dev/rocket_security"
branch = "main"

[workspace.dependencies.rusql-alchemy]
path = "../rusql-alchemy/rusql-alchemy"
features = ["sqlite"]

[workspace.dependencies.rusql-alchemy-migration]
path = "../rusql-alchemy/rusql-alchemy-migration"
features = ["sqlite"]

[workspace.dependencies]
sqlx = "0.8"
serde = "1.0.229"
rocket = "0.5.1"
rocket_dyn_templates = "0.2.0"
rocket_cors = "0.6.0"
models = { path = "models" }
tokio = "1.53.3"
anyhow = "1.0.95"
argon2 = "0.6.0-pre.1"
